; RUNNING TRAIN -- Twitch Tablet: DEFAULT settings
;
; Do not edit this file: mod updates replace it. Put your own settings into
; TwitchTablet.ini next to it (created on first start) -- anything there
; overrides the same key here, section by section. Copy a line or a whole
; section over and change it.
;
; After editing, the mod reloads by itself within a few seconds.
; Lines starting with ';' or '#' are comments.

[Twitch]
; Channel whose chat is shown, as in twitch.tv/<channel>. Read-only and
; anonymous: no login needed. Set it in TwitchTablet.ini.
Channel =
; false = do not connect at all.
Enabled = true

[Tablet]
; Show the tablet automatically when you are in the cab. The Tablet key (Num1) hides / shows it.
AutoSpawn = true

; How the tablet looks in a train that has no profile below yet. It then
; appears right in front of your eyes with a hint on its screen:
; Num0 to calibrate, NumEnter to save -- that creates the train's profile.
Scale = 1.03
Width = 16.0
Height = 21.0
FontScale = 3.0

[Screen]
; Brightness at start, 0.05 .. 1.0 (1.0 = full). The Dimmer / Brighter keys
; change it while playing (x0.8 per press); that is not saved.
Brightness = 0.64
; How many chat messages are kept (5 .. 500).
MaxMessages = 60
; Screen resolution in pixels per cm. Higher = sharper text, more GPU memory;
; the text keeps its size in cm either way.
PixelsPerCm = 53.3
; Twitch emotes as pictures (downloaded once into the emotecache folder next
; to this file). false = show them as words.
Emotes = true

[Keys]
; Action = key. Key names are Unreal's: NumPadZero .. NumPadNine, Add,
; Subtract, Multiply, Divide, Decimal, Enter, F1 .. F12, A .. Z,
; Zero .. Nine (top row), Insert, Home, PageUp, Delete, End, PageDown, ...
; An empty value switches the action off. No numpad? Move them, e.g.
; Tablet = Insert, Calibrate = Home, CalLeft = Left, CalRight = Right ...
; Keys 1-3 (camera) and F-keys collide with the game.
;
; Outside calibration:
Tablet = NumPadOne
Screen = NumPadTwo
Calibrate = NumPadZero
FontSmaller = NumPadFour
FontBigger = NumPadSix
Dimmer = NumPadSeven
Brighter = NumPadNine
Twitch = NumPadEight
Status = NumPadFive
; Testing aids, off by default: a local fake chat message, and dropping the
; Twitch connection on purpose (it must reconnect by itself).
FakeMessage =
DropConnection =
Reload = Multiply
; In calibration (Calibrate toggles it). Hold Alt for a x10 step; CalFine
; toggles a x0.1 step. (Not Ctrl: UE4SS itself runs dumps on Ctrl+Num6..9.)
CalMode = NumPadFive
CalLeft = NumPadFour
CalRight = NumPadSix
CalForward = NumPadEight
CalBack = NumPadTwo
CalUp = NumPadNine
CalDown = NumPadThree
CalBigger = Add
CalSmaller = Subtract
CalSave = Enter
CalReset = Decimal
CalInFront = Divide
CalFine = NumPadSeven

; ---------------------------------------------------------------------------
; Per-train profiles: [Train.<car class>] with X Y Z Pitch Yaw Roll (position
; and rotation relative to the cab interior -- the driver's desk, or the car
; body on trains without a separate desk -- in cm and degrees) plus, if they
; differ from [Tablet], Scale Width Height FontScale.
;
; NumEnter in calibration writes everything into the section of the train you
; are in, in TwitchTablet.ini (created if missing); a section there overrides
; the preset here. The previous file is kept as TwitchTablet.ini.bak. The car class is in ue4ss\UE4SS.log
; when the tablet appears ("tablet: train ... -> profile ...").
;
; Known trains (menu name = car class):
;   hr1500 = Cpy_KuHa115_C    hr1100 = Cpy_KuMoHa113_C
;   kr5000 = Cpy_KC1000Tc_C   DC8500 = Cpy_Kiha85Head_C

